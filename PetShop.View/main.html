<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Partner Peludo - Panel Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="CSS/main.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/main.js" defer></script>
    <script src="script/master.js" defer></script>
    <script src="script/carrito.js" defer></script>
    <script src="script/auth-utils.js" defer></script>
    <script src="script/config.js" defer></script>

</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white p-3 border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <img src="images/logo.png" alt="Logo" width="45" height="45" class="me-2 rounded-circle border border-dark">
                Tu Partner Peludo
            </a>

            <div class="d-flex align-items-center">
                <a href="#" class="text-dark me-4 position-relative" onclick="abrirCarrito()">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>

                <div class="d-flex flex-column align-items-end me-2">
                    <span id="user-name" class="fw-bold small text-uppercase mb-0"></span>
                    <span id="user-email" class="text-muted" style="font-size: 0.75rem;"></span>
                </div>
                <img id="user-img" src="" class="rounded-circle user-avatar" width="40" height="40">
                <button onclick="logout()" class="btn btn-sm ms-3 btn-outline-danger"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 bg-white p-3 border-end" style="min-height: 80vh;">
                <h5 class="fw-bold mb-4">Categorías</h5>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a href="#" class="nav-link text-dark active" onclick="filtrarProductos('todos')">Todos</a></li>
                    <li class="nav-item mb-2"><a href="#" class="nav-link text-dark" onclick="filtrarProductos('placas')">Placas</a></li>
                    <li class="nav-item mb-2"><a href="#" class="nav-link text-dark" onclick="filtrarProductos('accesorios')">Accesorios</a></li>
                </ul>
            </aside>

            <main class="col-md-10 p-4">
                <h2 class="mb-4">Productos Destacados</h2>
                <div class="row" id="contenedor-productos">
                </div>
            </main>
            <a href="admin-productos.html" id="btn-admin" class="nav-link text-danger d-none">
                <i class="fas fa-lock"></i> Panel Admin
            </a>
        </div>
    </div>
    <!-- Modal del Carrito de Compras -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalCarritoLabel"><i class="fa fa-shopping-cart"></i> Mi Carrito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="lista-carrito-body">
                                <!-- Los items del carrito se inyectarán aquí vía JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-end mt-3">
                        <h4 class="fw-bold">Total: $<span id="total-carrito">0</span></h4>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Seguir Comprando</button>
                    <button type="button" class="btn btn-dark" style="background: #836f14; border:none;" onclick="procederPago()">Proceder al Pago</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
