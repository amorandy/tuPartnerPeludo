<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Partner Peludo - Panel Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/main.css">

</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white p-3 border-bottom">
        <div class="container-fluid">

            <!-- Izquierda: Logo y Marca -->
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <img src="images/logo.png" alt="Logo" width="45" height="45" class="me-2 rounded-circle border border-dark">
                Tu Partner Peludo
            </a>

            <!-- Derecha: Agrupamos el Carrito y el Perfil con 'ms-auto' para empujarlos al final -->
            <div class="d-flex ms-auto align-items-center">

                <!-- Botón del Carrito -->
                <a href="#" class="text-dark text-decoration-none me-4 position-relative" onclick="abrirCarrito()">
                    <i class="fas fa-shopping-cart fs-5"></i>
                    <span class="ms-1 fw-bold d-none d-md-inline">Mis Pedidos</span>
                    <!-- Globo rojo contador -->
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none; font-size: 0.6rem;">
                        0
                    </span>
                </a>

                <!-- Menú de Usuario con Dropdown -->
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle border-0" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="text-end me-2 d-none d-md-block">
                            <div class="fw-bold text-uppercase" id="user-name" style="font-size: 0.9rem;">USUARIO</div>
                            <div class="text-muted" id="user-email" style="font-size: 0.75rem;">correo@ejemplo.com</div>
                        </div>
                        <img src="images/default-user.png" id="icono-usuario" class="rounded-circle border border-2 border-dark" width="45" height="45" style="object-fit: cover;" alt="Perfil">
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2" aria-labelledby="dropdownUser">
                        <li>
                            <a class="dropdown-item py-2" href="perfil.html">
                                <i class="fa fa-user me-2 text-muted"></i> Mi Perfil
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2 d-none" href="admin-productos.html" id="btn-admin-dropdown">
                                <i class="fa fa-shield-alt me-2 text-primary"></i> Panel Admin
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item py-2 text-danger" href="javascript:void(0)" onclick="logout()">
                                <i class="fa fa-sign-out-alt me-2"></i> Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </div>

            </div> <!-- Fin de la agrupación derecha -->

        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 bg-white p-3 border-end" style="min-height: 80vh;">
                <h5 class="fw-bold mb-4">Categorías</h5>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a href="#" class="nav-link text-dark active" onclick="filtrarProductos('todos')">Todos</a></li>
                    <li class="nav-item mb-2"><a href="#" class="nav-link text-dark" onclick="filtrarProductos('placas')">Placas</a></li>
                    <li class="nav-item mb-2"><a href="#" class="nav-link text-dark" onclick="filtrarProductos('accesorios')">Accesorios</a></li>
                </ul>
            </aside>

            <main class="col-md-10 p-4">
                <h2 class="mb-4">Productos Destacados</h2>
                <div class="row" id="contenedor-productos">
                </div>
            </main>
            <a href="admin-productos.html" id="btn-admin" class="nav-link text-danger d-none">
                <i class="fas fa-lock"></i> Panel Admin
            </a>
        </div>
    </div>
    <!-- Modal del Carrito de Compras -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalCarritoLabel"><i class="fa fa-shopping-cart"></i> Mi Carrito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="lista-carrito-body">
                                <!-- Los items del carrito se inyectarán aquí vía JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-end mt-3">
                        <h4 class="fw-bold">Total: $<span id="total-carrito">0</span></h4>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Seguir Comprando</button>
                    <button type="button" id="btn-proceder-pago" class="btn btn-warning" onclick="procederPago()">Proceder al Pago</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script/config.js"></script>
    <script src="script/master.js"></script>
    <script src="script/auth-utils.js"></script>
    <script src="script/carrito.js"></script>
    <script src="script/main.js"></script>
</body>
</html>
