<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Tu Partner Peludo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

    <script src="script/master.js"></script>

    <link rel="stylesheet" href="CSS/checkout.css" />
    <style>
    </style>
</head>
<body class="bg-light">

    <!-- Navbar simple para checkout -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="main.html"><i class="fas fa-arrow-left me-2"></i> Volver a la tienda</a>
            <span class="text-white fw-bold">Pago Seguro <i class="fas fa-lock text-success ms-1"></i></span>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">

            <!-- Columna Izquierda: Datos y Envío -->
            <div class="col-md-7 col-lg-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">1. Datos del Cliente</h5>
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="text-muted small">Nombre Completo</label>
                                <p class="fw-bold" id="chk-nombre"></p>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="text-muted small">Correo Electrónico</label>
                                <p class="fw-bold" id="chk-email"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">2. Dirección de Envío</h5>
                            <button class="btn btn-sm btn-outline-dark fw-bold" onclick="window.location.href='mis-direcciones.html'">
                                <i class="fas fa-map-marker-alt me-1"></i> Administrar Direcciones
                            </button>
                        </div>
                        <div class="row g-3" id="contenedor-direcciones">

                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">3. Método de Pago</h5>
                        <select class="form-select form-select-lg mb-3" id="metodo-pago">
                            <option value="transferencia">Transferencia Bancaria</option>
                            <option value="webpay">Webpay Plus (Tarjetas)</option>
                            <option value="mercadopago">MercadoPago</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Resumen del Pedido -->
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
                    <div class="card-header bg-white py-3">
                        <h5 class="fw-bold mb-0">Resumen del Pedido</h5>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="chk-lista-productos">
                            <!-- JS inyecta productos aquí -->
                        </ul>
                    </div>
                    <div class="card-footer bg-white p-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal (Neto)</span>
                            <span class="fw-bold" id="chk-subtotal">$0</span>
                        </div>
                        <!-- Esta es la fila que muestra el IVA -->
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">IVA (19%)</span>
                            <span class="fw-bold" id="chk-impuesto">$0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                            <span class="text-muted">Envío</span>
                            <span class="text-success fw-bold">Por calcular</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 fw-bold">Total a Pagar</span>
                            <span class="fs-5 fw-bold" id="chk-total">$0</span>
                        </div>
                        <button class="btn btn-dark w-100 py-3 fw-bold" onclick="confirmarCompra()">Confirmar Compra</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="script/master.js"></script>
    <script src="script/config.js"></script>
    <script src="script/checkout.js"></script>
</body>
</html>
